<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<link rel="canonical" href="{{CANONICAL}}" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

<!-- Open Graph / Social Sharing -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE}}" />

<!-- Schema.org Educational Resource -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LearningResource",
  "name": "{{JSONLD_NAME}}",
  "description": "{{JSONLD_DESCRIPTION}}",
  "educationalLevel": "Grades 4-8",
  "learningResourceType": "Interactive Simulation",
  "interactivityType": "mixed",
  "inLanguage": "en",
  "keywords": "solar system, astronomy, 3D simulation, planetary scale, NASA, science education",
  "audience": {
    "@type": "EducationalAudience",
    "educationalRole": "student"
  }
}
</script>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4DYFKSNFBG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4DYFKSNFBG');
</script>

<!-- Google AdSense Script -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4410729598083068"
     crossorigin="anonymous"></script>

<link rel="stylesheet" href="/assets/css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
  }
}
</script>
</head>
<body>
{{NAV}}
<main>
{{CONTENT}}
</main>
{{FOOTER}}

{{SCRIPT}}
</body>
</html>
