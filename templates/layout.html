<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}" />
<meta name="robots" content="max-image-preview:large" />
<link rel="canonical" href="{{CANONICAL}}" />
<link rel="icon" type="image/svg+xml" href="{{BASE}}/assets/favicon.svg" />

<!-- Open Graph / Social Sharing -->
<meta property="og:type" content="website" />
<meta property="og:url" content="{{CANONICAL}}" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:image" content="{{OG_IMAGE}}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE}}" />

<!-- Structured data is generated from each page's metadata. -->
{{STRUCTURED_DATA}}

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-4DYFKSNFBG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-4DYFKSNFBG', { content_group: 'Space Atlas' });
</script>

{{ADSENSE_HEAD}}

<link rel="stylesheet" href="{{BASE}}/assets/css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
  }
}
</script>
</head>
<body>
{{NAV}}
<main>
{{CONTENT}}
</main>
{{FOOTER}}

<!-- Instant Topic Search Modal -->
<div class="search-modal-backdrop" id="searchModal" hidden>
  <div class="search-modal" role="dialog" aria-modal="true" aria-label="Search all topics">
    <div class="search-box-row">
      <span class="search-modal-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search {{TOPIC_COUNT}} space topics... (e.g., tides, seasons, black holes, pluto)" autocomplete="off" />
      <button class="search-modal-close" id="searchClose" aria-label="Close search">✕</button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-hint">Type any question, planet, or topic to instantly filter Space Atlas. Press <kbd>ESC</kbd> to exit.</div>
    </div>
  </div>
</div>

<script type="module" src="{{BASE}}/assets/js/nav.js"></script>
<script type="module" src="{{BASE}}/assets/js/search-modal.js"></script>
{{SCRIPT}}
</body>
</html>
