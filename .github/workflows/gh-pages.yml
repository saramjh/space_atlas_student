name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p public
          cp -R *.html public/ 2>/dev/null || true
          cp -R *.css  public/ 2>/dev/null || true
          cp -R *.js   public/ 2>/dev/null || true
          cp -R *.txt  public/ 2>/dev/null || true
          cp -R *.xml  public/ 2>/dev/null || true
          cp -R assets public/ 2>/dev/null || true
          cp -R img    public/ 2>/dev/null || true
          # GitHub Pages needs an index.html at the site root
          if [ ! -f public/index.html ] && [ -f public/space_atlas_student.html ]; then
            cp public/space_atlas_student.html public/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
