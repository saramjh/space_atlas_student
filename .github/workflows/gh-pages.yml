name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build site
        env:
          SITE_BASE: /space_atlas_student
          ADSENSE_ENABLED: "1"
        run: python3 build.py

      - name: Verify generated site
        run: |
          python3 ci/verify_build.py
          python3 ci/verify_updates.py
          python3 ci/verify_footer.py
          node ci/verify_spectrum.mjs
          node ci/verify_p1_visuals.mjs
          node ci/verify_image_provenance.mjs
          node ci/verify_planet_3d.mjs
          node ci/verify_true_scale.mjs
          node ci/verify_text_visualizations.mjs
          node ci/verify_remaining_visualizations.mjs
          node ci/verify_kepler.mjs
          node ci/verify_quality_fixes.mjs
          for file in assets/js/*.js; do node --check "$file"; done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
